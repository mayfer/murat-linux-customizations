# Per-app overrides for keyd-application-mapper.
# Class names are normalized: org.kde.konsole → org-kde-konsole
# Discover names: keyd-application-mapper -v

# Konsole / other terminals: Cmd+T/N/W are Ctrl+Shift+… (Linux terminal defaults).
# Physical Ctrl stays Ctrl, so Ctrl+C is still SIGINT.

[*konsole*]
cmd.t = C-S-t
cmd.n = C-S-n
cmd.w = C-S-w

[*yakuake*]
cmd.t = C-S-t
cmd.n = C-S-n
cmd.w = C-S-w

[org-kde-konsole]
cmd.t = C-S-t
cmd.n = C-S-n
cmd.w = C-S-w
