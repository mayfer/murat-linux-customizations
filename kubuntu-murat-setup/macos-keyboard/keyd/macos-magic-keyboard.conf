# macOS-like bindings for an Apple Magic Keyboard on Linux.
#
# Physical layout (already Mac-like; we do NOT swap Option/Command):
#   Control | Option (Alt) | Command (Super) | Space | Command | Option
#
# Command is a Control layer with macOS navigation overrides.
# Physical Control is left alone, so Ctrl+C still sends SIGINT in a terminal.
#
# Cmd+C/V/X use the X11 clipboard keys (Ctrl+Insert / Shift+Insert / Shift+Delete)
# so copy-paste works in GUI apps AND terminals without sending Ctrl+C.

[ids]
# Apple Magic Keyboard A1644 on this machine (USB).
# Add further IDs from `sudo keyd.rvaiya monitor` if a Bluetooth or
# newer Magic Keyboard is not remapped. Prefix k: matches keyboards only.
k:05ac:0267
05ac:0267
# Other common Magic Keyboard product IDs (wired + Bluetooth).
k:05ac:024f
k:05ac:0250
k:05ac:026c
k:05ac:029c
k:05ac:029f
k:05ac:02cb
k:004c:0267
k:004c:029f
k:004c:02cb
004c:0267

[main]
# Command (Super) → macOS Cmd layer. Tap does nothing (same as macOS).
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Option → Alt, with word-wise arrow/delete overrides.
leftalt = layer(opt)
rightalt = layer(opt)

# Physical Control stays Control (terminal Ctrl+C, Ctrl+D, Ctrl+R, ...).

# Cmd layer: unmapped combos become Ctrl+key (Cmd+A/S/F/T/N/Z/W/…).
[cmd:C]
# Copy / paste / cut that are safe in terminals (not SIGINT).
c = C-insert
v = S-insert
x = S-delete

# Line / document motion (macOS Cmd+arrows).
left = home
right = end
up = C-home
down = C-end

# Cmd+Backspace: delete to start of line.
# Cmd+Delete (Fn+Backspace on compact Magic Keyboard): delete to end of line.
backspace = macro(S-home backspace)
delete = macro(S-end delete)

# App switcher vs same-app windows. KDE binds Alt+Tab / Alt+`.
# These must be *separate* swap layers. A single app_switch layer that
# maps grave → Alt+Shift+Tab (macOS: ` reverses while already in Cmd+Tab)
# also swallows Cmd+` and turns it into the all-windows switcher.
tab = swapm(app_switch, A-tab)
grave = swapm(win_switch, A-grave)

# Spotlight analogue: KRunner is Alt+Space.
space = A-space

# Quit / hide / minimize.
q = A-f4
h = M-pagedown
m = M-pagedown

# Browser history back/forward (macOS Cmd+[ / Cmd+]).
leftbrace = A-left
rightbrace = A-right

# Mission Control / desktop analogues.
f3 = M-d
f9 = M-f9
f10 = M-f10

[opt:A]
# Word-wise motion / delete (macOS Option+arrows / Option+Delete).
left = C-left
right = C-right
up = C-up
down = C-down
backspace = C-backspace
delete = C-delete

# Held-Cmd app switcher (Alt stays down until Command is released).
# ` reverses here only after Cmd+Tab, matching macOS.
[app_switch:A]
tab = A-tab
right = A-tab
left = A-S-tab
grave = A-S-tab

# Keep reverse-switch working while Shift is still held.
[app_switch+shift]
tab = A-S-tab
grave = A-tab

# Held-Cmd same-app window switcher (Alt stays down until Command is released).
[win_switch:A]
grave = A-grave

[win_switch+shift]
grave = A-S-grave

# Cmd+Shift: selection and a few combos that must NOT be Ctrl+Shift.
[cmd+shift]
left = S-home
right = S-end
up = C-S-home
down = C-S-end
backspace = macro(S-home backspace)
delete = macro(S-end delete)
tab = swapm(app_switch, A-S-tab)
grave = swapm(win_switch, A-S-grave)
leftbrace = C-pageup
rightbrace = C-pagedown
# Screenshots (KDE Spectacle defaults).
3 = print
4 = S-print
5 = C-print

# Option+Shift: extend selection by word.
[opt+shift]
left = C-S-left
right = C-S-right
up = C-S-up
down = C-S-down

# Control+Option+arrows would otherwise become Ctrl+arrows (word jump from
# [opt]) and never reach KWin as Ctrl+Alt. Composite layers cannot take a
# :C-A suffix; emit the full chord here.
[opt+control]
left = C-A-left
right = C-A-right
up = C-A-up
down = C-A-down
enter = C-A-enter
kpenter = C-A-enter
f = C-A-f

# Cmd+Option: force-quit analogue.
[cmd+opt]
esc = M-C-esc

# Ctrl+Cmd+Q: lock screen (macOS).
[cmd+control]
q = M-l
